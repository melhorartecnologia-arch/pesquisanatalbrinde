services:
  banco:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pesquisa_natal
      POSTGRES_USER: natal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-natal}
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U natal -d pesquisa_natal']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      banco:
        condition: service_healthy
    ports:
      - '${PORT:-3000}:3000'
    environment:
      PORT: 3000
      DATABASE_URL: postgres://natal:${POSTGRES_PASSWORD:-natal}@banco:5432/pesquisa_natal
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD no arquivo .env}
      SESSION_SECRET: ${SESSION_SECRET:?Defina SESSION_SECRET no arquivo .env}
      VOTACAO_ENCERRA_EM: ${VOTACAO_ENCERRA_EM:-}
      SETORES: ${SETORES:-}
      TRUST_PROXY: ${TRUST_PROXY:-}

volumes:
  dados-postgres:
