# Nginx: recebe os acessos na porta 80 e repassa para o Node.js (porta 3000).
# Copie para /etc/nginx/sites-available/pesquisa-natal e troque o server_name.
server {
    listen 80;

    # Seu domínio (ex.: pesquisa.cidadeimperial.com.br).
    # Sem domínio, deixe "_" e acesse pelo IP do servidor.
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
